name: "Linux Build (x64)"

# Escriba: build de Linux a demanda para QA en máquinas reales (primer
# candidato: el PC Ubuntu de Alejandro, 18-jul-2026). Dos variantes x64:
# AppImage (portable, glibc de 24.04+) y .deb (compilado en 22.04 para
# compatibilidad amplia). Linux factura a 1x: es el runner más barato.
on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
            args: "--bundles appimage"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
