name: "Windows Build (solo x64)"

# Escriba: build de Windows a demanda, lo más barato posible — UNA plataforma
# (windows-latest x64, instalador NSIS), sin firma de binarios, artefacto
# descargable por 30 días. Pensado para QA en máquinas Windows reales (el
# primer usuario: el esposo de Flor, 16-jul-2026) sin quemar la matriz
# completa de 7 plataformas. Los minutos de Windows facturan a 2x en repos
# privados: este workflow es la versión de un solo cañonazo.
on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
